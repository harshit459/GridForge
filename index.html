<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridForge</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Toolbar -->
    <header id="toolbar"></header>

    <!-- Formula Bar -->
    <section id="formula-bar">
        <input type="text" id="name-box" readonly>
        <input type="text" id="formula-input">
    </section>

    <!-- Spreadsheet -->
    <main id="spreadsheet">
        <table id="spreadsheet-table"></table>
    </main>

    <!-- Status Bar -->
    <footer id="status-bar">
        <button id="debug-button">Show Data</button>
    </footer>

    <script type="module" src="js/app.js"></script>

</body>

</html>
